[package]
name = "contextpilot-app"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "contextpilot"
path = "src/main.rs"
[dependencies]
contextpilot-core = { path = "../contextpilot-core" }
contextpilot-providers = { path = "../contextpilot-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
sha2 = "0.10"
schemars = "1.2"
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
